name: CI (Python)

on:
  push:
    branches: [main, "v3/**"]
  pull_request:
    branches: [main, "v3/**"]

# Workflow-level permissions: GitHub's CodeQL warns when the
# GITHUB_TOKEN's permissions are not scoped explicitly. This CI just
# reads source + runs tests; ``contents: read`` is the minimum that
# lets ``actions/checkout`` clone the repo. No write surfaces are
# exercised here (no commenting, no releases, no PR mutations), so
# every other permission stays at the workflow-level default of
# ``none``.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Resolve ctxr-fsm sibling ref
        # Pre-publish (Principle 2 — manual PyPI release), the
        # ``ctxr-fsm`` dependency is resolved from the sibling editable
        # checkout at ``../fsm/`` declared under ``[tool.uv.sources]``.
        # The fsm repo's ``main`` is still the legacy Node tree (no
        # Python package); the Python rewrite ships from workstream
        # branches (w1, …, w14j). We pick the deepest applied chain
        # tip as the integration target so the consumer always builds
        # against the freshest Python ctxr-fsm. Override via the
        # ``CTXR_FSM_REF`` repo variable when a specific PR branch
        # needs to be tested. The fallback list is tried in order
        # because branches get merged + deleted as the chain advances.
        id: fsm_ref
        env:
          CTXR_FSM_REF: ${{ vars.CTXR_FSM_REF }}
        run: |
          set -euo pipefail
          # W14 + W15 + W18-W21 have all merged on the fsm repo;
          # `main` IS the freshest Python ctxr-fsm. The legacy W14
          # workstream branches that used to live here would silently
          # pin this build to a stale tip when one of them still
          # exists as an orphan (w14a/inline-handler-engine still
          # does), which is what caused the W21 mypy failures. The
          # candidate list now just tries the optional CTXR_FSM_REF
          # override then falls straight to main.
          candidates=(
            "${CTXR_FSM_REF:-}"
            "main"
          )
          chosen=""
          for ref in "${candidates[@]}"; do
            if [ -z "$ref" ]; then continue; fi
            if git ls-remote --exit-code https://github.com/ctxr-dev/fsm.git "refs/heads/$ref" >/dev/null 2>&1; then
              chosen="$ref"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::no candidate ctxr-fsm ref resolved (override via repo variable CTXR_FSM_REF)"
            exit 1
          fi
          echo "ref=$chosen" >> "$GITHUB_OUTPUT"

      - name: Clone ctxr-fsm sibling
        # Clone the resolved branch + assert pyproject.toml is present
        # (the legacy Node main branch lacks it; we want to fail fast
        # with a clear message rather than confuse uv sync later).
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.fsm_ref.outputs.ref }}" \
            https://github.com/ctxr-dev/fsm.git ../fsm
          if [ ! -f ../fsm/pyproject.toml ]; then
            echo "::error::cloned ${{ steps.fsm_ref.outputs.ref }} but no pyproject.toml at the root"
            exit 1
          fi

      - name: Sync (with dev extras)
        # The sibling clone above satisfies the ``../fsm`` path source
        # declared in ``pyproject.toml [tool.uv.sources]`` so a plain
        # ``uv sync --all-extras`` resolves cleanly without touching
        # PyPI for ctxr-fsm.
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check code_review/ tests/

      - name: Mypy
        run: uv run mypy code_review/

      - name: Pytest
        run: uv run pytest -q

  wiki-drift:
    name: Wiki drift (reviewers.wiki == rebuild(reviewers.src))
    runs-on: ubuntu-latest
    # reviewers.src is the source of truth; reviewers.wiki is a deterministic,
    # layout-pinned projection of it. This job rebuilds the wiki from source via the
    # sibling skill-llm-wiki and fails if the committed reviewers.wiki/ differs, so a
    # hand-edited wiki (or a source change committed without rebuilding the wiki)
    # cannot merge. See scripts/check_wiki_drift.py.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone skill-llm-wiki sibling
        # The drift check shells out to skill-llm-wiki's build. Pre-publish it is
        # resolved from a sibling checkout (same pattern as the ctxr-fsm clone above).
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/ctxr-dev/skill-llm-wiki.git ../skill-llm-wiki
          cd ../skill-llm-wiki && npm install --no-audit --no-fund

      - name: Check wiki drift
        # Pure-stdlib script: rebuilds into a temp dir and byte-compares to the
        # committed wiki. SKILL_LLM_WIKI defaults to ../skill-llm-wiki/scripts/cli.mjs.
        run: python3 scripts/check_wiki_drift.py
