[project]
name = "ctxr-skill-code-review"
version = "3.0.0"
description = "FSM-driven, deterministic, manifest-producing code-review pipeline. Python ctxr-fsm port (LLM-as-orchestrator)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["code-review", "fsm", "agent", "claude", "ctxr-fsm", "skill"]
authors = [{ name = "ctxr-dev" }]
dependencies = [
  # 0.2.0 ships W14a's InlineHandler engine extension. During dev the
  # `[tool.uv.sources]` block below pins this to the sibling editable
  # checkout at `../fsm/` (Principle 2); manual PyPI publish flips
  # this constraint to the real 0.2.0 once ctxr-fsm releases.
  # The `[all]` extras pull mcp + sqlite + api (httpx + uvicorn +
  # fastapi + sse-starlette). Required because the SKILL.md bootstrap
  # preamble runs `ctxr-fsm ensure`, whose ensure_cmd module imports
  # httpx at module top — a `[sqlite]`-only install would fail at
  # import time. Picking `[all]` aligns with Principle 1: the universal
  # pre-check primitive must work from a plain install of this skill.
  "ctxr-fsm[all]>=0.1.0a1",
  "pydantic>=2.7",
  "jsonschema>=4.23",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# DEV/bench-only statistics + calibration stack for the Martian benchmark
# program (scripts/stats.py, scripts/calibrate.py). These are NOT runtime
# deps: the code_review package gains ZERO new runtime deps in phase A0.
# They are imported only under scripts/ (and the tracker's lazy gate path),
# behind pytest.importorskip in the tests, so a plain install stays green.
bench = [
  # bootstrap PR-resampling for recall/precision/F1 CIs + the ECE helper.
  "numpy>=1.26",
  # paired permutation_test on delta-F1 (scipy.stats.permutation_test).
  "scipy>=1.11",
  # exact McNemar (contingency_tables) + Benjamini-Hochberg FDR (multitest).
  "statsmodels>=0.14",
  # isotonic/Platt calibration, GroupKFold, PR-curve, Brier, calibration_curve
  # (plan 7.2 / A2 scripts/calibrate.py; added now so the dev env is ready).
  "scikit-learn>=1.4",
]

[project.entry-points."ctxr_fsm.skills"]
skill-code-review = "code_review.install:register"

[project.scripts]
ctxr-skill-code-review-install = "code_review.install:main"

[project.urls]
Homepage = "https://github.com/ctxr-dev/skill-code-review"
Issues = "https://github.com/ctxr-dev/skill-code-review/issues"

# Dev-only sibling-linking per Principle 2 (manual publish + file:../sibling
# during dev). Removed before any manual PyPI publish; consumers always
# install ctxr-fsm from PyPI.
[tool.uv.sources]
ctxr-fsm = { path = "../fsm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_review"]

[tool.hatch.build]
# Worker prompt .md files ship inside the package so install.py can resolve
# them via importlib.resources at runtime.
include = ["code_review/**/*.py", "code_review/**/*.md", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["code_review"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# python-frontmatter ships untyped — treat its surface as Any at the
# import boundary; the handlers narrow what they read back to typed
# Python structures.
module = ["frontmatter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
